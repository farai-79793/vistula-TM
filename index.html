<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <h1>Task Manager</h1>
      <p class="badge">Student ID <span id="student-id">79839</span></p>
    </div>
  </header>

  <main>
    <p id="status-message" role="status"></p>

    <form id="task-form" class="composer">
      <label>Title
        <input id="task-title" placeholder="e.g. Learn Git" required>
      </label>
      <label>Description
        <input id="task-description" placeholder="Optional details">
      </label>
      <button id="task-submit" type="submit">Add task</button>
    </form>

    <div id="task-list"></div>

    <p class="footer-link"><a id="contribution-link" href="contribution.html">Team contribution page</a></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
